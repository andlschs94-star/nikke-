name: Apply v0.327 drop-rate control colors
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); marker="v0327-drop-rate-controls"; css="<style id=\"v0327-drop-rate-controls\">#dropRatePanel .drop-rate-pool input,#dropRatePanel .drop-stage-btn,#dropRatePanel .drop-rate-details-toggle{background:#f8fcfe!important;color:#405b6c!important;border:1px solid #bfd5df!important;box-shadow:none!important}#dropRatePanel .drop-stage-btn:hover,#dropRatePanel .drop-rate-details-toggle:hover{background:#eaf6fb!important;color:#2f5368!important;border-color:#8fc3d9!important}#dropRatePanel .drop-rate-value{color:#405b6c!important}</style>"; s=s if marker in s else s.replace("</head>",css+"</head>",1); p.write_text(s,encoding="utf-8")'
      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix drop-rate control colors v0.327"
          git push