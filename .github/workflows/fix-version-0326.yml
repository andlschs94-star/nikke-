name: Apply v0.328 light gear panel surfaces
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); marker="v0328-light-gear-panels"; css="<style id=\"v0328-light-gear-panels\">#dropRatePanel .drop-rate-wrap,#ownedCorporatePanel .corp-owned-wrap,#unusedGearTransferPanel .unused-gear-transfer-wrap,.gear-summary-wrap{background:#f8fcfe!important;color:#405b6c!important;border-color:#bfd5df!important;box-shadow:none!important}#dropRatePanel .drop-rate-head,#dropRatePanel .drop-rate-footnote,#ownedCorporatePanel .corp-owned-note,#unusedGearTransferPanel .unused-gear-transfer-note,.gear-summary-note{background:#edf7fb!important;color:#5d7383!important;border-color:#cfe1eb!important}#dropRatePanel .drop-rate-card{background:#f8fcfe!important;border-color:#c7dce6!important}#dropRatePanel .drop-rate-card h4,#dropRatePanel .drop-rate-note,#dropRatePanel .drop-rate-pool label,#dropRatePanel .drop-rate-row label,#dropRatePanel .drop-rate-sub,#dropRatePanel .drop-rate-result,#dropRatePanel .drop-rate-footnote{color:#5d7383!important}#dropRatePanel .drop-rate-pool input,#dropRatePanel .drop-stage-btn,#dropRatePanel .drop-rate-details-toggle{background:#fff!important;color:#405b6c!important;border:1px solid #bfd5df!important;box-shadow:none!important}#dropRatePanel .drop-rate-details-toggle:hover,#dropRatePanel .drop-stage-btn:hover{background:#eaf6fb!important;color:#2f5368!important}#dropRatePanel .drop-rate-result{border-top-color:#c5dbe5!important}#dropRatePanel .drop-rate-result b{color:#294b5e!important}#ownedCorporatePanel .drop-rate-toggle,#ownedCorporatePanel .corp-owned-wrap>div:first-child,#unusedGearTransferPanel .unused-gear-transfer-title,.gear-summary-title-toggle{background:#edf7fb!important;color:#405b6c!important;border-color:#cfe1eb!important}#ownedCorporatePanel .corp-owned-table,#unusedGearTransferPanel .unused-gear-transfer-table,.gear-summary{background:#f8fcfe!important}#ownedCorporatePanel .corp-owned-table th,#unusedGearTransferPanel .unused-gear-transfer-table th,.gear-summary th{background:#e5f2f8!important;color:#506b7b!important;border-color:#c7dce6!important}#ownedCorporatePanel .corp-owned-table td,#unusedGearTransferPanel .unused-gear-transfer-table td,.gear-summary td{background:#f8fcfe!important;color:#405b6c!important;border-color:#d3e3ea!important}#ownedCorporatePanel .corp-owned-table tr:nth-child(even) td,#unusedGearTransferPanel .unused-gear-transfer-table tr:nth-child(even) td,.gear-summary tr:nth-child(even) td{background:#f0f7fa!important}#ownedCorporatePanel .corp-owned-table .total-row td,.gear-summary .total-row td{background:#e5f2f8!important;color:#294b5e!important;border-color:#bfd5df!important}#unusedGearTransferPanel .unused-gear-transfer-title:hover,.gear-summary-title-toggle:hover{background:#e6f4f9!important}#unusedGearTransferPanel .unused-gear-transfer-empty{background:#f8fcfe!important;color:#6b8291!important}#unusedGearTransferPanel .unused-gear-transfer-section-title{background:#edf7fb!important;color:#405b6c!important;border-color:#cfe1eb!important}#unusedGearTransferPanel .unused-gear-transfer-target-row{border-color:#cce8dc!important}#unusedGearTransferPanel .unused-gear-transfer-table .source{color:#b44f65!important}#unusedGearTransferPanel .unused-gear-transfer-table .target{color:#29845d!important}#unusedGearTransferPanel .unused-gear-transfer-table b,#unusedGearTransferPanel .unused-gear-transfer-table strong{color:#294b5e!important}.gear-summary-title{background:#edf7fb!important;color:#405b6c!important;border-color:#cfe1eb!important}.gear-summary-title-toggle span{color:#688092!important}</style>"; s=s if marker in s else s.replace("</head>",css+"</head>",1); s=s.replace("VERSION 0.327","VERSION 0.328"); p.write_text(s,encoding="utf-8")'
      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Lighten internal surfaces of gear panels v0.328"
          git push