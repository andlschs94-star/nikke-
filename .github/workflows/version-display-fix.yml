name: Fix NIKKE Pages Version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-version-fix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync visible version
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          v=Path('VERSION').read_text(encoding='utf-8').strip()
          # Replace the old visible site-version token, whether or not it has a leading v.
          s=re.sub(r'v0\.\d{3}', 'v'+v, s)
          s=re.sub(r'(?<![\w.])0\.\d{3}(?![\w.])', v, s)
          p.write_text(s,encoding='utf-8')
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
