name: Fix NIKKE Pages Version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-version-fix
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync version and sidebar
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          v=Path('VERSION').read_text(encoding='utf-8').strip()
          s=re.sub(r'v0\.\d{3}','v'+v,s)
          s=re.sub(r'(?<![\w.])0\.\d{3}(?![\w.])',v,s)
          css='''<style id="sidebar-final-fix-v0386">.sidebar{pointer-events:auto!important}.sidebar:not(.open){transform:translateX(calc(-100% + 14px))!important}.sidebar.open{transform:translateX(0)!important;pointer-events:auto!important}.sidebar:hover{transform:translateX(calc(-100% + 14px))!important}.sidebar.open:hover{transform:translateX(0)!important}.sidebar-hitarea{pointer-events:auto!important;z-index:120!important}.sidebar-hitarea.open{width:228px!important}</style>'''
          if 'sidebar-final-fix-v0386' not in s:s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
