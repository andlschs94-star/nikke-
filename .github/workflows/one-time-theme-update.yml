name: One-time theme UI update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("btn.textContent=dark?'☾':'☀';", "btn.textContent=dark?'🌙':'☀️';")
          s=s.replace('>☀</button><button type="button" class="btn account-switch-btn', '>☀️</button><button type="button" class="btn account-switch-btn')
          css='''<style id="v0376-theme-toggle-final">.account-switcher{display:flex!important;align-items:center!important;gap:8px!important}.blsync-top-btn{background:#fff1dc!important;border:1px solid #e5a14f!important;color:#a85f16!important;box-shadow:0 2px 8px rgba(214,142,50,.16)!important}.blsync-top-btn:hover{background:#ffe5bf!important;border-color:#d4872c!important;color:#8f4d0d!important}.theme-toggle-btn{width:40px!important;height:40px!important;min-width:40px!important;padding:0!important;margin:0!important;font-size:20px!important;line-height:1!important;display:inline-grid!important;place-items:center!important}html.dark-theme .theme-toggle-btn{background:#101827!important;border-color:#344660!important;color:#dbe7f3!important;box-shadow:none!important}html.dark-theme .theme-toggle-btn:hover{background:#18253a!important;border-color:#55708f!important;color:#fff!important}</style>'''
          if 'v0376-theme-toggle-final' not in s: s=s.replace('</head>',css+'</head>',1)
          m=re.search(r'VERSION\s+(\d+\.\d+)',s)
          if m:
            old=m.group(1); a,b=old.split('.'); new=f'{a}.{int(b)+1:03d}'
            s=s.replace(f'VERSION {old}',f'VERSION {new}',1)
            s=re.sub(r'v0\.375',f'v{new}',s)
            Path('VERSION').write_text(new+'\n',encoding='utf-8')
          p.write_text(s,encoding='utf-8')
      - name: Commit update and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-theme-update.yml
          git add index.html VERSION
          git commit -m "UI: theme toggle and account sync emphasis"
          git push
