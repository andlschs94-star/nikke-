name: Fix remaining dark surfaces
on:
  push:
    paths:
      - '.github/workflows/fix-dark-surfaces-v0325.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* v0.325 dark surface fix */'
          if marker not in s:
              patch='''\n/* v0.325 dark surface fix */\n<style id="v0325-dark-surface-fix">\n/* Only large dark UI surfaces are converted; typography and small controls are preserved. */\n.v0325-light-surface{background:#f8fcfe!important;color:inherit!important;border-color:#c5dce8!important;box-shadow:none!important}\n.v0325-light-surface *{color:inherit}\n</style>\n<script>\n(function(){\n  function fix(){\n    var els=document.querySelectorAll('body *');\n    for(var i=0;i<els.length;i++){\n      var e=els[i];\n      if(!e || e.id==='v0325-dark-surface-fix' || e.closest('.sidebar') || e.closest('.nav')) continue;\n      var r=e.getBoundingClientRect();\n      if(r.width<260 || r.height<28 || r.width*r.height<9000) continue;\n      var cs=getComputedStyle(e), bg=cs.backgroundColor;\n      var m=bg.match(/rgba?\\((\\d+)[, ]+(\\d+)[, ]+(\\d+)(?:[, ]+([\\d.]+))?\\)/);\n      if(!m) continue;\n      var a=m[4]===undefined?1:parseFloat(m[4]);\n      var rr=+m[1],gg=+m[2],bb=+m[3];\n      if(a<0.15) continue;\n      if(rr<80 && gg<100 && bb<125){\n        e.classList.add('v0325-light-surface');\n      }\n    }\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fix); else fix();\n  setTimeout(fix,500); setTimeout(fix,1500);\n})();\n</script>\n'''
              s=s.replace('</body>',patch+'</body>')
          s=s.replace('GitHub Pages deployment refresh 0.324','GitHub Pages deployment refresh 0.325')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched site and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix remaining dark window surfaces (v0.325)' || true
          git rm .github/workflows/fix-dark-surfaces-v0325.yml
          git commit -m 'Remove temporary v0.325 patch workflow'
          git push