name: Cleanup malformed version text

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair visible malformed text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('VERSION 0.330', 'VERSION 0.331')
          marker = '</body>'
          script = r'''<script>
(function(){
  function clean(node){
    const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);
    const remove=[];
    let n;
    while(n=w.nextNode()){
      const t=n.nodeValue||'';
      if(/^[\\s\\n]*(?:\\/\\*|\\*\\/|\\*)[\\s\\n]*$/.test(t) || /^(?:\\/\\*|\\*\\/)[\\s\\n]+$/.test(t)) remove.push(n);
    }
    remove.forEach(x=>x.parentNode&&x.parentNode.removeChild(x));
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>clean(document.body)); else clean(document.body);
})();
</script>'''
          if 'function clean(node)' not in s:
              s=s.replace(marker, script+'\n'+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix malformed text next to version display (v0.331)'
          git push