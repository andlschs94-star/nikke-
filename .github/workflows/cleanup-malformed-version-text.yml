name: Finalize NIKKE version display

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair version display
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'/\*+\s*\*/?\s*', '', s)
          s = re.sub(r'\*/+\s*', '', s)
          s = s.replace(r'\n', '')
          s = re.sub(r'v0\.327\s+light\s+window\s+surfaces', '', s, flags=re.I)
          s = re.sub(r'0\.327', '0.331', s)
          s = re.sub(r'v0\.330', 'v0.331', s)
          s = re.sub(r'0\.330', '0.331', s)
          s = re.sub(r'<script>\s*\(function\(\)\{\s*function clean\(node\).*?</script>\s*', '', s, flags=re.S)
          p.write_text(s, encoding='utf-8')

          for wf in [
              '.github/workflows/cleanup-malformed-version-text.yml',
              '.github/workflows/repair-site-version.yml',
          ]:
              q = Path(wf)
              if q.exists():
                  q.unlink()
      - name: Commit final repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Finalize version display v0.331'
          git push