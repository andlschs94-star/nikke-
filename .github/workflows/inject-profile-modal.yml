name: Inject profile import modal
on:
  push:
    branches: [main]
jobs:
  inject:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Inject profile import modal')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject button and modal into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- PROFILE_IMPORT_MODAL_V1 -->'
          if marker in s:
              print('already injected')
              raise SystemExit(0)
          css='''<style id="profile-import-style">#profileImportBtn{width:auto!important;display:inline-flex!important;align-items:center;justify-content:center;border:1px solid #5b4d8f!important;background:#16142a!important;color:#dcd6ff!important;border-radius:7px!important;padding:6px 9px!important;margin:0 6px 0 0!important;font-size:11px!important;font-weight:800!important;line-height:1.1!important;white-space:nowrap!important}.profile-import-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}.profile-import-overlay.open{display:flex}.profile-import-modal{width:min(720px,96vw);height:min(620px,90vh);background:#0f1729;border:1px solid #394766;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}.profile-import-modal-head{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid #26324b;color:#edf2ff;font-weight:900;font-size:13px}.profile-import-close{border:0;background:transparent;color:#9eabc1;font-size:22px;line-height:1;padding:4px 7px;cursor:pointer}.profile-import-frame{width:100%;height:100%;border:0;background:#0f1729}</style>'''
          js='''<script id="profile-import-modal-script">(()=>{function init(){const sync=[...document.querySelectorAll('button,.btn')].find(e=>(e.textContent||'').replace(/\\s/g,'').includes('계정동기화'));if(!sync||document.getElementById('profileImportBtn'))return;const b=document.createElement('button');b.id='profileImportBtn';b.type='button';b.textContent='프로필 불러오기';sync.parentNode.insertBefore(b,sync);const ov=document.createElement('div');ov.className='profile-import-overlay';ov.innerHTML='<div class="profile-import-modal" role="dialog" aria-modal="true"><div class="profile-import-modal-head"><span>BlaBlaLink 프로필 캐릭터 불러오기</span><button class="profile-import-close" type="button" aria-label="닫기">×</button></div><iframe class="profile-import-frame" src="profile-import-test.html" title="BlaBlaLink 프로필 캐릭터 불러오기"></iframe></div>';document.body.appendChild(ov);b.addEventListener('click',()=>ov.classList.add('open'));ov.querySelector('.profile-import-close').addEventListener('click',()=>ov.classList.remove('open'));ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')ov.classList.remove('open')})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script>'''
          if '</head>' in s: s=s.replace('</head>',css+'</head>',1)
          else: s=css+s
          if '</body>' in s: s=s.replace('</body>',js+'</body>',1)
          else: s+=js
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Inject profile import modal'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/inject-profile-modal.yml
          git add -u .github/workflows/inject-profile-modal.yml || true
          git commit -m 'Remove temporary profile modal workflow' || true
          git push || true
