name: Lighten settings gear v0.329
on:
  push:
    paths:
      - '.github/workflows/fix-settings-gear-0329.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch settings gear
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='v0329-settings-gear'
          css='''<style id="v0329-settings-gear">
          /* v0.329: match the top-right settings gear to the site's light UI */
          .settings-btn{background:#f8fcfe!important;color:#405b6c!important;border:1px solid #bfd5df!important;box-shadow:none!important}
          .settings-btn:hover,.settings-btn.active{background:#eaf6fb!important;color:#294b5e!important;border-color:#8fc3d9!important}
          </style>'''
          if marker not in s:
              s=s.replace('</head>', css+'</head>', 1)
          s=s.replace('VERSION 0.328','VERSION 0.329')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Lighten top-right settings gear v0.329"
          git push
