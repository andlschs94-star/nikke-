name: Sidebar content preserve v0.387
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply sidebar final override and bump version
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="sidebar-content-preserve-v0387">
/* v0.387: opening the sidebar must leave the current page visible */
html,body{background:var(--bg)!important}
.app{background:var(--bg)!important;min-height:100vh!important}
.main{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:1!important;background:var(--bg)!important;min-height:100vh!important}
.sidebar{z-index:2000!important}
.sidebar-backdrop{background:transparent!important;backdrop-filter:none!important;opacity:0!important;pointer-events:none!important}
.sidebar.open{transform:translateX(0)!important;z-index:2000!important}
.sidebar:hover{transform:translateX(calc(-100% + 14px))!important}
.sidebar.open:hover{transform:translateX(0)!important}
body.sidebar-open .sidebar{transform:translateX(0)!important;z-index:2000!important}
body.sidebar-open .sidebar:hover{transform:translateX(0)!important}
</style>'''
          if 'sidebar-content-preserve-v0387' not in s:
            s=s.replace('</head>',css+'</head>',1)
          vf=Path('VERSION')
          old=vf.read_text(encoding='utf-8').strip() if vf.exists() else '0.386'
          m=re.fullmatch(r'(\d+)\.(\d+)',old)
          new=f'{m.group(1)}.{int(m.group(2))+1:03d}' if m else '0.387'
          vf.write_text(new+'\n',encoding='utf-8')
          s=re.sub(r'VERSION\s+0\.386',f'VERSION {new}',s)
          s=re.sub(r'(?<![0-9])0\.386(?![0-9])',new,s)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sidebar-content-preserve-v0387.yml
          git add index.html VERSION
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix sidebar preserving current page"
          git push
