name: Apply accordion cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='accordion-cleanup-v0400'
          patch='''<style id="accordion-cleanup-v0400">\n/* v0.400: remove stray wrapper surfaces around the two light-mode accordions */\nhtml:not(.dark-theme) #kpis,\nhtml:not(.dark-theme) .drop-rate-accordion-wrap,\nhtml:not(.dark-theme) .drop-rate-section-wrap{background:transparent!important;border-color:transparent!important;box-shadow:none!important}\nhtml.dark-theme #kpis,html.dark-theme .drop-rate-accordion-wrap,html.dark-theme .drop-rate-section-wrap{box-shadow:none!important}\n</style>\n<script id="accordion-cleanup-js-v0400">\n(function(){function clean(){if(document.documentElement.classList.contains('dark-theme'))return;var ns=['보유 중인 기업장비 개수','미사용 캐릭터 장비 이동 안내'];document.querySelectorAll('body *').forEach(function(el){if(el.children.length||!el.textContent)return;var t=el.textContent.replace(/\\s+/g,' ').trim();if(!ns.some(function(n){return t.indexOf(n)>=0}))return;var p=el.parentElement;for(var i=0;i<6&&p;i++,p=p.parentElement){var b=getComputedStyle(p).backgroundColor;if(b==='rgb(255, 255, 255)'||b==='rgb(249, 252, 254)'||b==='rgb(248, 252, 255)'){p.style.setProperty('background','transparent','important');p.style.setProperty('border-color','transparent','important');p.style.setProperty('box-shadow','none','important')}}})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean);else clean();setTimeout(clean,200);setTimeout(clean,800)})();\n</script>'''
          if marker not in s:
              s=s.replace('</head>',patch+'</head>',1)
              p.write_text(s,encoding='utf-8')
          vf=Path('VERSION')
          old=vf.read_text(encoding='utf-8').strip() if vf.exists() else '0.399'
          m=re.fullmatch(r'(\d+)\.(\d+)',old)
          new=f'{m.group(1)}.{int(m.group(2))+1:03d}' if m else '0.400'
          vf.write_text(new+'\n',encoding='utf-8')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(?<![0-9])0\.399(?![0-9])',new,s)
          p.write_text(s,encoding='utf-8')
          print('version',old,'->',new)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html VERSION
          git commit -m "fix: clean accordion wrapper surfaces"
          git push
