name: Add known bugs panel

on:
  push:
    paths:
      - '_known-bugs-panel-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="knownBugsBtn"' in s:
              print('known bugs panel already applied')
              raise SystemExit(0)

          old = '''<button type="button" class="btn blsync-top-btn" style="background:#fff1dc!important;border:1px solid #e5a14f!important;color:#a85f16!important;box-shadow:0 2px 8px rgba(214,142,50,.16)!important;font-weight:900!important" onclick="openBlablalinkSyncGuide()">계정 동기화</button>'''
          new = old + '''<button type="button" class="btn known-bugs-top-btn" id="knownBugsBtn" onclick="openKnownBugsPanel()">인지한 버그</button>'''
          if old not in s:
              raise SystemExit('topbar target not found')
          s = s.replace(old, new, 1)

          marker = '<div class="site-version-corner" id="siteVersionCorner">VERSION 1.100</div>'
          if marker in s:
              s = s.replace(marker, '<div class="site-version-corner" id="siteVersionCorner">VERSION 1.101</div>', 1)
          else:
              s = s.replace('VERSION 1.100', 'VERSION 1.101', 1)

          css = '''
<style id="known-bugs-panel-v101">
.known-bugs-top-btn{background:#eef6ff!important;border:1px solid #9fc1df!important;color:#2d6088!important;box-shadow:0 2px 8px rgba(74,126,166,.12)!important;font-weight:900!important;white-space:nowrap}
.known-bugs-top-btn:hover{background:#e3f1ff!important;border-color:#76a9d0!important}
.known-bugs-overlay{position:fixed;inset:0;z-index:10050;background:rgba(16,31,45,.38);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:22px}
.known-bugs-overlay[hidden]{display:none!important}
.known-bugs-modal{width:min(760px,calc(100vw - 30px));max-height:min(82vh,760px);overflow:auto;background:#f8fcfe;border:1px solid #b9d3e0;border-radius:14px;box-shadow:0 24px 70px rgba(31,69,91,.25);color:#29465a}
.known-bugs-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid #c7dce6;background:#f8fcfe}
.known-bugs-head h3{margin:0;font-size:18px;font-weight:1000}.known-bugs-close{width:34px;height:34px;border:1px solid #b9d3e0;background:#fff;border-radius:9px;color:#567286;font-size:20px;line-height:1}
.known-bugs-body{padding:18px}.known-bugs-section{border:1px solid #c7dce6;border-radius:11px;background:#fff;overflow:hidden;margin-bottom:14px}.known-bugs-section:last-child{margin-bottom:0}
.known-bugs-section-title{padding:12px 14px;background:#edf6fb;border-bottom:1px solid #c7dce6;font-weight:1000;font-size:14px;color:#2e6485}.known-bugs-list{margin:0;padding:10px 16px 12px 34px}.known-bugs-list li{padding:6px 0;font-size:13px;line-height:1.5;color:#38556a}.known-bugs-note{font-size:11px;color:#7890a0;margin-top:4px}
html.dark-theme .known-bugs-overlay{background:rgba(0,0,0,.58)}html.dark-theme .known-bugs-modal{background:#111b2b;border-color:#344660;color:#e6eef8}html.dark-theme .known-bugs-head{background:#111b2b;border-color:#344660}html.dark-theme .known-bugs-close{background:#18253a;border-color:#3b506c;color:#d8e5f3}html.dark-theme .known-bugs-section{background:#152238;border-color:#344660}html.dark-theme .known-bugs-section-title{background:#1a2b42;border-color:#344660;color:#bfe2ff}html.dark-theme .known-bugs-list li{color:#c9d7e7}
</style>'''
          s = s.replace('</head>', css + '</head>', 1)

          modal = '''
<div class="known-bugs-overlay" id="knownBugsOverlay" hidden onclick="if(event.target===this)closeKnownBugsPanel()">
  <div class="known-bugs-modal" role="dialog" aria-modal="true" aria-labelledby="knownBugsTitle">
    <div class="known-bugs-head"><div><h3 id="knownBugsTitle">인지한 버그 · 추가 예정</h3><div class="known-bugs-note">현재는 목록만 표시하며, 아래 항목 자체는 수정하지 않습니다.</div></div><button type="button" class="known-bugs-close" aria-label="닫기" onclick="closeKnownBugsPanel()">×</button></div>
    <div class="known-bugs-body">
      <section class="known-bugs-section">
        <div class="known-bugs-section-title">확인해서 수정 예정인 버그들</div>
        <ul class="known-bugs-list">
          <li>캐릭터 사진이 잘못 배정되있음</li>
          <li>어두운 화면보기에서 유효 버튼이 제대로 안 보이는 문제</li>
          <li>미사용 일괄적용에서 필터를 바꾸면 체크가 풀리는 문제</li>
          <li>밝은 화면에서 전체 니케 캐릭터 이름을 누르면 어두운 창으로 뜨는 문제 (누르는 것 자체를 삭제할 수도 있음)</li>
        </ul>
      </section>
      <section class="known-bugs-section">
        <div class="known-bugs-section-title">추가 예정인 것들 (우선도 랜덤)</div>
        <ul class="known-bugs-list">
          <li>스테이지 덱 추천 (완전 뉴비용)</li>
          <li>스테이지 덱 추천을 위한 니케 도감</li>
          <li>소장품 키트 계산기</li>
          <li>큐브 소모재화정보</li>
          <li>장비 경험치 수급량 계산기</li>
          <li>스킬칩 소모량 확인</li>
        </ul>
      </section>
    </div>
  </div>
</div>
<script>
function openKnownBugsPanel(){const m=document.getElementById('knownBugsOverlay');if(m){m.hidden=false;document.body.style.overflow='hidden'}}
function closeKnownBugsPanel(){const m=document.getElementById('knownBugsOverlay');if(m){m.hidden=true;document.body.style.overflow=''}}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeKnownBugsPanel()});
</script>'''
          s = s.replace('</body>', modal + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('patched index.html')

      - name: Commit patch and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add known bugs and planned features panel' || true
          rm -f _known-bugs-panel-trigger.txt .github/workflows/add-known-bugs-panel.yml
          git add -A
          git commit -m 'chore: clean up one-time panel patch workflow' || true
          git push
