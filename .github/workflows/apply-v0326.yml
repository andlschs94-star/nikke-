name: Apply v0.326 site update
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
/* v0.326: light styling for corporate equipment acquisition probability controls */
.drop-rate-accordion select,.drop-rate-accordion input,.drop-rate-accordion button,.drop-rate-accordion .btn,.drop-rate-accordion [role="button"]{background:#f8fcfe!important;color:#203247!important;border:1px solid #bdd6e3!important;box-shadow:none!important}
.drop-rate-accordion select:hover,.drop-rate-accordion button:hover,.drop-rate-accordion .btn:hover,.drop-rate-accordion [role="button"]:hover{background:#eaf5fa!important;border-color:#8fbfd3!important}
.drop-rate-accordion select:focus{outline:none;box-shadow:0 0 0 2px rgba(115,179,210,.22)!important}
.drop-rate-accordion .drop-rate-detail,.drop-rate-accordion .drop-rate-details,.drop-rate-accordion .drop-rate-random-detail,.drop-rate-accordion .drop-rate-random-detail-button,.drop-rate-accordion .random-corporate-detail,.drop-rate-accordion .random-corporate-gear-detail,.drop-rate-accordion .stage-rate,.drop-rate-accordion .stage-rate-select,.drop-rate-accordion .rate-box{background:#f8fcfe!important;color:#203247!important;border-color:#c4dbe6!important}
.drop-rate-accordion .stage-rate strong,.drop-rate-accordion .stage-rate .percent,.drop-rate-accordion .rate-value,.drop-rate-accordion .percent{color:#6877d8!important}
'''
          if 'v0.326: light styling for corporate equipment acquisition probability controls' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          s = s.replace('0.325','0.326')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Apply v0.326 site update'
            git push
          fi
