name: Fix drop-rate inner colors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-drop-rate-0327.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch drop-rate panel
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('0.326','0.327')
          marker='/* v0.327 drop-rate inner surfaces */'
          css='''<style>\n/* v0.327 drop-rate inner surfaces */\nbody.drop-rate-view .drop-rate-accordion,\nbody.drop-rate-view .drop-rate-accordion * {\n  background-color:#f8fcfe !important;\n  color:#243447 !important;\n  border-color:#c9dce6 !important;\n}\nbody.drop-rate-view .drop-rate-accordion button,\nbody.drop-rate-view .drop-rate-accordion select {\n  background:#eaf5fa !important;\n  color:#243447 !important;\n  border:1px solid #bdd6e3 !important;\n}\nbody.drop-rate-view .drop-rate-accordion button:hover {\n  background:#dceef6 !important;\n  border-color:#8fc3da !important;\n}\nbody.drop-rate-view .drop-rate-accordion table th {\n  background:#e5f2f8 !important;\n  color:#30485c !important;\n}\nbody.drop-rate-view .drop-rate-accordion table td {\n  background:#f8fcfe !important;\n  color:#243447 !important;\n}\nbody.drop-rate-view .drop-rate-accordion [style*="background"] {\n  background:#f8fcfe !important;\n}\nbody.drop-rate-view .drop-rate-accordion .drop-rate-stage,\nbody.drop-rate-view .drop-rate-accordion .drop-rate-percent,\nbody.drop-rate-view .drop-rate-accordion .drop-rate-random-detail {\n  background:#f8fcfe !important;\n  color:#243447 !important;\n}\n</style>'''
          if marker not in s:
              s=s.replace('</head>', css+'\n</head>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-drop-rate-0327.yml
          git add index.html .github/workflows/fix-drop-rate-0327.yml
          git commit -m 'Fix dark inner surfaces in corporate gear drop-rate panel (v0.327)' || exit 0
          git push
