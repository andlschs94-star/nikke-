name: Lighten character table unused check v0.330

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch unused check color
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''\n/* v0.330: lighten the far-right "미사용" check in the character table */\n#characterPanel table tbody tr td:last-child button,\n#characterPanel table tbody tr td:last-child .unused-check,\n#characterPanel table tbody tr td:last-child [class*="unused"] {\n  background: #eaf6fb !important;\n  color: #35566b !important;\n  border: 1px solid #9fc7d9 !important;\n  box-shadow: none !important;\n  text-shadow: none !important;\n}\n#characterPanel table tbody tr td:last-child button:hover,\n#characterPanel table tbody tr td:last-child .unused-check:hover {\n  background: #dceff7 !important;\n  border-color: #79aec6 !important;\n}\n'''\n          marker = '/* v0.330: lighten the far-right "미사용" check in the character table */'\n          if marker not in s:\n              s = s.replace('</style>', css + '</style>', 1)\n          s = s.replace('VERSION 0.329', 'VERSION 0.330')\n          s = s.replace('VERSION 0.328', 'VERSION 0.330')\n          s = s.replace('VERSION 0.327', 'VERSION 0.330')\n          p.write_text(s, encoding='utf-8')\n          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Lighten character table unused check v0.330"
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-unused-check-0330.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-unused-check-0330.yml
          git commit -m "Remove temporary unused check workflow v0.330"
          git push
