name: Fix sidebar white screen
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='sidebar-white-screen-fix-v0387'; patch='<style id=\"sidebar-white-screen-fix-v0387\">.sidebar{z-index:99999!important;position:fixed!important;top:0!important;left:0!important;height:100vh!important}.sidebar.open{transform:translateX(0)!important;pointer-events:auto!important}.sidebar-backdrop,[class*=\"sidebar-backdrop\"]{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;background:transparent!important}.main{display:block!important;visibility:visible!important;opacity:1!important;filter:none!important;min-height:100vh!important;background:var(--bg)!important}.app{min-height:100vh!important;background:var(--bg)!important}</style>'; s=s if marker in s else s.replace('</head>',patch+'</head>',1); p.write_text(s,encoding='utf-8')"
          printf '0.387\n' > VERSION
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html VERSION
          git diff --cached --quiet || git commit -m "fix: sidebar overlay and version 0.387"
          git push
