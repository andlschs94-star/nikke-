name: Apply v0.324 theme fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* v0.324 light window surfaces */'
          if marker not in s:
              css = r'''\n/* v0.324 light window surfaces */\n<style id="v0324-window-surfaces">\n/* Keep text colors unchanged; only replace dark window/card/panel surfaces. */\n.panel, .kpi,\n#ownedCorporatePanel, #unusedGearTransferPanel,\n.column-filter-popover, .settings-popover, .filter-modal-card, .drawer-card,\n.exclude-modal, .backup-code-card, .blsync-modal, .sole-score-card,\n.sole-reward-card, .drop-rate-card, .owned-corporate-card, .unused-transfer-card,\n.modal, .modal-content, .popup, .popup-content, .popover, .popover-content,\n.dialog, .dialog-content, .window, .window-content {\n  background:#f8fcfe !important;\n  border-color:#c9e0ef !important;\n  box-shadow:0 10px 30px rgba(61,105,130,.14) !important;\n}\n.panel-head, .filter-modal-head, .filter-modal-foot, .drawer-head,\n.blsync-head, .sole-reward-head, .sole-score-card-head,\n.modal-header, .modal-footer, .popup-header, .popup-footer,\n.dialog-header, .dialog-footer, .window-header, .window-footer {\n  background:#edf7fb !important;\n  border-color:#d0e2eb !important;\n}\n.column-filter-option, .quick-gear-btn, .quick-gear-close,\n.column-filter-actions button, .filter-chip, .backup-code-actions .btn,\n.exclude-toolbar .btn {\n  background:#ffffff !important;\n  border-color:#c4dbe6 !important;\n}\n.column-filter-option:hover, .quick-gear-btn:hover, .quick-gear-close:hover,\n.column-filter-actions button:hover, .backup-code-actions .btn:hover,\n.exclude-toolbar .btn:hover {\n  background:#eaf6fb !important;\n  border-color:#8fc3da !important;\n}\n.backup-code-textarea, .exclude-toolbar input, .settings-popover input,\n.filter-modal-card input, .filter-modal-card select {\n  background:#ffffff !important;\n  border-color:#c1d9e5 !important;\n}\n.outpost-calc, .outpost-production-collapse {\n  background:#f8fcfe !important;\n  border-color:#c9e0ef !important;\n}\n.outpost-calc-head, .outpost-production-toggle {\n  background:#edf7fb !important;\n}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
          s = s.replace('VERSION 0.323', 'VERSION 0.324')
          s = s.replace('v0.323', 'v0.324', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix dark window surfaces (v0.324)'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-v0324-theme.yml
          git commit -m 'Remove temporary theme patch workflow'
          git push
