name: Fix dark theme page background
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix dark mode background
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="dark-background-fix-v0392">
/* v0.392: dark mode must cover the full viewport; light-mode page background rules must not leak into dark mode. */
html.dark-theme,
html.dark-theme body,
html.dark-theme #app,
html.dark-theme .app{
  background:#070b14!important;
  background-image:radial-gradient(circle at 20% 0,#182240 0,#0a0f1d 42%,#070b14 100%)!important;
  color:#edf3ff!important;
}
html.dark-theme .main{
  background:#070b14!important;
  color:#edf3ff!important;
}
/* The main content is centered on desktop, so the side gutters must also stay dark. */
html.dark-theme body::before,
html.dark-theme body::after{
  background:transparent!important;
}
/* Prevent previous light-mode fixes from painting dark-mode sections light. */
html.dark-theme .v0325-light-surface,
html.dark-theme [class*="v0325-light-surface"]{
  background:#101827!important;
  border-color:#2a3952!important;
  color:#dce6f3!important;
}
html.dark-theme .drop-rate-view,
html.dark-theme .drop-rate-view #app,
html.dark-theme .drop-rate-view .app,
html.dark-theme .drop-rate-view .main,
html.dark-theme .drop-rate-view main,
html.dark-theme .drop-rate-view .content,
html.dark-theme .drop-rate-view .section,
html.dark-theme .drop-rate-view .panel,
html.dark-theme .drop-rate-view .card,
html.dark-theme .drop-rate-view .accordion,
html.dark-theme .drop-rate-view .accordion-wrap,
html.dark-theme .drop-rate-view .equipment-section,
html.dark-theme .drop-rate-view .equipment-panel-wrap,
html.dark-theme .drop-rate-view .corporate-equipment-section,
html.dark-theme .drop-rate-view .corporate-equipment-panel-wrap,
html.dark-theme .drop-rate-view .drop-rate-accordion,
html.dark-theme .drop-rate-view .drop-rate-panel,
html.dark-theme .drop-rate-view .drop-rate-section{
  background:#101827!important;
  color:#dce6f3!important;
}
</style>'''
          if 'dark-background-fix-v0392' not in s:
            s=s.replace('</head>',css+'</head>',1)
          v=Path('VERSION')
          old=v.read_text(encoding='utf-8').strip()
          m=re.fullmatch(r'(\d+)\.(\d+)',old)
          new=f'{m.group(1)}.{int(m.group(2))+1:03d}' if m else '0.392'
          v.write_text(new+'\n',encoding='utf-8')
          # Update the visible version when it is hard-coded in the page.
          s=re.sub(r'VERSION\s+0\.\d{3}',f'VERSION {new}',s)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html VERSION
          git rm .github/workflows/fix-dark-background-v0392.yml
          git commit -m "fix: restore dark theme page background"
          git push
