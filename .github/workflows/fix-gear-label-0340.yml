name: Fix gear part labels v0.340
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix labels and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n<style id="gear-label-visibility-0340">\n/* 0.340: keep colored gear labels readable */\n.gear-part.overload .part-name{color:#5d4a96!important}\n.gear-part.overload .part-state{color:#5d4a96!important}\n.gear-part.company .part-name{color:#26734f!important}\n.gear-part.company .part-state{color:#26734f!important}\n.gear-part.other .part-name{color:#9e3f55!important}\n.gear-part.other .part-state{color:#9e3f55!important}\n</style>\n'''
          if 'gear-label-visibility-0340' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          v = Path('VERSION')
          if v.exists():
              v.write_text('0.340\n', encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html VERSION
          git diff --cached --quiet && exit 0
          git commit -m 'Fix gear part label visibility v0.340'
          git push
      - name: Remove one-shot workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-gear-label-0340.yml
          git add .github/workflows/fix-gear-label-0340.yml
          git commit -m 'Remove one-shot gear label workflow'
          git push
