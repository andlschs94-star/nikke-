name: One-time skill detail column update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update skill column and version
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_detail = "const DETAIL_COLUMNS=['전투력','버스트','속성','돌파','코강','옵션','큐브'];"
          new_detail = "const DETAIL_COLUMNS=['전투력','버스트','속성','돌파','코강','스킬','옵션','큐브'];"
          if old_detail not in s:
              raise SystemExit('DETAIL_COLUMNS target not found')
          s = s.replace(old_detail, new_detail, 1)

          old_return = "if(Array.isArray(v)) return new Set(v.filter(k=>DETAIL_COLUMNS.includes(k)));"
          new_return = "if(Array.isArray(v)) return new Set([...v,'스킬'].filter(k=>DETAIL_COLUMNS.includes(k)));"
          if old_return not in s:
              raise SystemExit('column visibility initializer target not found')
          s = s.replace(old_return, new_return, 1)

          new_version = '0.383'
          s = s.replace('VERSION 0.379', f'VERSION {new_version}')
          s = s.replace('VERSION 0.382', f'VERSION {new_version}')
          Path('VERSION').write_text(new_version + '\n', encoding='utf-8')
          p.write_text(s, encoding='utf-8')

      - name: Commit update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html VERSION
          git commit -m "UI: hide skill column with detail columns"
          git rm .github/workflows/one-time-skill-detail-update.yml
          git add .github/workflows/one-time-skill-detail-update.yml
          git commit -m "chore: remove one-time skill detail workflow"
          git push
