name: Restore last known-good index

on:
  push:
    paths:
      - '.github/workflows/restore-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index.html
        run: |
          git checkout 384608c3ffecee7a87dc6342cf596be0675a415e -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore last known-good index.html'
          git push
