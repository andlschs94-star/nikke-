name: Repair displayed version and visible text

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the malformed visible patch text that was accidentally inserted into the page.
          s = re.sub(r'\s*\*/\s*v0\.327\s+light\s+window\s+surfaces\s*\*/\s*', '\n', s, flags=re.I)
          s = re.sub(r'\s*v0\.327\s+light\s+window\s+surfaces\s*', '\n', s, flags=re.I)

          # Fix every remaining old displayed version in the HTML.
          s = s.replace('0.327', '0.330')
          s = s.replace('v0.327', 'v0.330')

          # Keep the requested light UI surfaces even if older dark declarations remain elsewhere.
          css = r'''
          /* v0.330 light window surfaces */
          .panel,.card,.modal,.modal-content,.popover,.dropdown-menu,
          .drop-rate-panel,.drop-rate-accordion,.equipment-panel,
          .equipment-summary,.equipment-table-wrap,.need-panel,
          .unused-panel,.character-panel,.settings-panel,
          #dropRatePanel,#ownedCorpPanel,#unusedMovePanel,#needPanel {
            background:#f7fbfe !important;
            color:#33495f !important;
            border-color:#b9d2e4 !important;
          }
          .panel *, .card *, .modal *, .modal-content *, .popover *,
          .drop-rate-panel *, .equipment-panel *, .need-panel *,
          .unused-panel *, .character-panel * { border-color:#c8dce9; }
          .drop-rate-accordion button,.detail-btn,.details-btn,
          .random-equipment-detail,.settings-btn {
            background:#eaf3f8 !important;
            color:#33495f !important;
            border-color:#b7cfdf !important;
          }
          '''
          if '/* v0.330 light window surfaces */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Repair site display to v0.330"
          git push
