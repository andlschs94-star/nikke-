name: One-time dark gear contrast fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve dark gear status contrast
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="v0378-dark-gear-contrast">
/* v0.378: 어두운 화면 장비 상태 대비 강화 */
html.dark-theme .gear-part{
  color:#eef4ff!important;
  background:#172238!important;
  border-color:#425474!important;
  opacity:1!important;
}
html.dark-theme .gear-part .part-name{
  color:#f2f6ff!important;
}
html.dark-theme .gear-part .part-state{
  color:#d8e2f3!important;
}
html.dark-theme .gear-part.equipped{
  background:#172238!important;
  border-color:#50627f!important;
}
html.dark-theme .gear-part.equipped .part-state{
  color:#c6d5e9!important;
}
html.dark-theme .gear-part.missing{
  opacity:1!important;
  background:#141f31!important;
  border:1px dashed #657590!important;
}
html.dark-theme .gear-part.missing .part-name{
  color:#dfe8f5!important;
}
html.dark-theme .gear-part.missing .part-state{
  color:#b8c6d9!important;
}
html.dark-theme .gear-part.overload{
  background:linear-gradient(180deg,#30255a,#241d43)!important;
  border-color:#a18cff!important;
  box-shadow:inset 0 0 0 1px rgba(190,175,255,.16),0 0 7px rgba(155,124,255,.10)!important;
}
html.dark-theme .gear-part.overload .part-name{
  color:#f0ebff!important;
}
html.dark-theme .gear-part.overload .part-state{
  color:#d9ccff!important;
}
html.dark-theme .gear-part.company{
  background:linear-gradient(180deg,#1a3d2c,#123021)!important;
  border-color:#6fcb98!important;
}
html.dark-theme .gear-part.company .part-name{
  color:#e4fff0!important;
}
html.dark-theme .gear-part.company .part-state{
  color:#91efb5!important;
}
html.dark-theme .gear-part.other{
  background:linear-gradient(180deg,#43232d,#2d1820)!important;
  border-color:#dc7d8e!important;
}
html.dark-theme .gear-part.other .part-name{
  color:#fff0f3!important;
}
html.dark-theme .gear-part.other .part-state{
  color:#ffb1bd!important;
}
</style>'''
          if 'v0378-dark-gear-contrast' not in s:
            s=s.replace('</head>',css+'</head>',1)
          m=re.search(r'VERSION\s+(\d+\.\d+)',s)
          if m:
            old=m.group(1); a,b=old.split('.'); new=f'{a}.{int(b)+1:03d}'
            s=s.replace(f'VERSION {old}',f'VERSION {new}',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit update and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-dark-gear-contrast.yml
          git add index.html
          git commit -m "Improve dark theme gear status contrast"
          git push
