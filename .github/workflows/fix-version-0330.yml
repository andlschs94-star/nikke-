name: Fix displayed version v0.330
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix displayed version
        run: |
          sed -E -i 's/(VERSION[[:space:]]*)0\.[0-9]+/\10.330/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix displayed version v0.330"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-version-0330.yml || true
          git commit -m "Remove temporary version workflow" || true
          git push || true
