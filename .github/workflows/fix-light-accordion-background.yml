name: Fix light accordion background
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove white strips around equipment accordions
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="light-accordion-background-fix-v0391">
/* v0.391: keep light-theme accordion surrounding areas on the same page background */
.light-accordion-bg-fix{background:transparent!important}
</style>'''
          js='''<script id="light-accordion-background-fix-js-v0391">
(function(){
  function fix(){
    const targets=['보유 중인 기업장비 개수','미사용 캐릭터 장비 이동 안내'];
    document.querySelectorAll('*').forEach(el=>{
      const text=(el.textContent||'').replace(/\\s+/g,' ').trim();
      if(!targets.includes(text)) return;
      let p=el.parentElement;
      for(let i=0;i<5 && p;i++,p=p.parentElement){
        const bg=getComputedStyle(p).backgroundColor;
        if(bg==='rgb(249, 252, 254)' || bg==='rgba(249, 252, 254, 1)'){
          p.classList.add('light-accordion-bg-fix');
          break;
        }
      }
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fix);
  else fix();
  window.addEventListener('load',fix);
})();
</script>'''
          if 'light-accordion-background-fix-v0391' not in s:
            s=s.replace('</head>',css+js+'</head>',1)
          vf=Path('VERSION')
          old=vf.read_text(encoding='utf-8').strip() if vf.exists() else '0.390'
          m=re.fullmatch(r'(\d+)\.(\d+)',old)
          new=f'{m.group(1)}.{int(m.group(2))+1:03d}' if m else '0.391'
          vf.write_text(new+'\n',encoding='utf-8')
          s=re.sub(r'(?<![0-9])0\.390(?![0-9])',new,s)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-light-accordion-background.yml
          git add index.html VERSION
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix white strips around light equipment accordions"
          git push
