name: Sidebar overlay fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sidebar overlay and version
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="sidebar-overlay-fix-v0387">
/* v0.387: sidebar overlays the page without whitening the content */
.sidebar{z-index:10000!important}
.sidebar.open{position:fixed!important;left:0!important;top:0!important;bottom:0!important;transform:translateX(0)!important;box-shadow:12px 0 30px rgba(0,0,0,.28)!important}
body.sidebar-open .sidebar-backdrop, .sidebar-backdrop{background:transparent!important;backdrop-filter:none!important;pointer-events:none!important}
body.sidebar-open .main, body.sidebar-open main, body.sidebar-open .content, body.sidebar-open #app{filter:none!important;opacity:1!important;background:inherit!important}
</style>'''
          if 'sidebar-overlay-fix-v0387' not in s:
            s=s.replace('</head>',css+'</head>',1)
          # Keep the repository version and visible version synchronized.
          vf=Path('VERSION')
          old=vf.read_text(encoding='utf-8').strip() if vf.exists() else '0.386'
          m=re.fullmatch(r'(\d+)\.(\d+)',old)
          new=f'{m.group(1)}.{int(m.group(2))+1:03d}' if m else '0.387'
          vf.write_text(new+'\n',encoding='utf-8')
          # Replace only the currently hard-coded visible version occurrences.
          s=re.sub(r'(?<![0-9])0\.386(?![0-9])',new,s)
          s=s.replace('0.385',new)
          s=s.replace('0.384',new)
          s=s.replace('0.383',new)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sidebar-overlay-fix.yml
          git add index.html VERSION
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix sidebar overlay without whitening page"
          git push
