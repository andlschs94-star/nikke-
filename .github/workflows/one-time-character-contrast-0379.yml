name: One-time character contrast fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply character column contrast and bump version
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''<style id="v0379-character-column-final">
          /* v0.379: 전체 캐릭터 표의 캐릭터명 가독성 강화 */
          html.dark-theme #characterPanel tbody td:nth-child(2),
          html.dark-theme #characterPanel tbody td:nth-child(2) *,
          html.dark-theme #characterPanel tbody td:nth-child(2) span,
          html.dark-theme #characterPanel tbody td:nth-child(2) div {
            color:#f5f8ff!important;
            opacity:1!important;
            filter:none!important;
            font-weight:900!important;
            text-shadow:0 1px 3px rgba(0,0,0,.85)!important;
          }
          html.dark-theme #characterPanel tbody td:nth-child(2) {
            background:#18243a!important;
            border-left:1px solid #3b4e6c!important;
            border-right:1px solid #3b4e6c!important;
          }
          html.dark-theme #characterPanel tbody tr:nth-child(even) td:nth-child(2) {
            background:#162238!important;
          }
          </style>'''
          if 'v0379-character-column-final' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          s = s.replace('0.378', '0.379')
          p.write_text(s, encoding='utf-8')
          Path('VERSION').write_text('0.379\n', encoding='utf-8')
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-character-contrast-0379.yml
          git add index.html VERSION
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: improve dark character column contrast"
          git push
