name: Hide stray literal comment text

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe visual patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '/* hide stray literal comment text v1 */'
          if marker not in s:
              injection = '''<script>\n/* hide stray literal comment text v1 */\n(function(){\n  var re = /^\\s*(?:\\\\n)?\\s*\\/\\*\\s*\\*\\/\\s*(?:\\\\n)?\\s*$/;\n  var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);\n  var n;\n  while (n = w.nextNode()) {\n    if (re.test(n.nodeValue || '')) n.nodeValue = '';\n  }\n})();\n</script>'''
              if '</body>' in s:
                  s = s.replace('</body>', injection + '\n</body>', 1)
              else:
                  s += '\n' + injection + '\n'

          css_marker = '/* v0.333 unused status light patch */'
          if css_marker not in s:
              css = '''<style>\n/* v0.333 unused status light patch */\n.unused-status-toggle:not(.active):not(.unowned){\n  background:#f8fcfe!important;\n  border-color:#b9d1df!important;\n  color:#587184!important;\n  box-shadow:0 2px 7px rgba(61,101,126,.05)!important;\n}\n.unused-status-toggle:not(.active):not(.unowned):hover{\n  background:#eef8fc!important;\n  border-color:#7db5d1!important;\n  color:#35677f!important;\n}\n</style>'''
              if '</head>' in s:
                  s = s.replace('</head>', css + '\n</head>', 1)
              else:
                  s = css + '\n' + s

          visual_marker = '/* v0.334 account sync and gear status light patch */'
          if visual_marker not in s:
              visual_css = '''<style>\n/* v0.334 account sync and gear status light patch */\n.blsync-top-btn{\n  background:#dff1fb!important;\n  border-color:#7db5d1!important;\n  color:#2f6078!important;\n  box-shadow:0 2px 8px rgba(61,101,126,.10)!important;\n}\n.blsync-top-btn:hover{\n  background:#cdebf8!important;\n  border-color:#5fa5c7!important;\n  color:#24536b!important;\n}\n.gear-part.overload{\n  background:#eee8ff!important;\n  border-color:#b8a9e8!important;\n}\n.gear-part.overload .part-state{color:#6655a2!important}\n.gear-part.company{\n  background:#e8f7ef!important;\n  border-color:#9bd0b1!important;\n}\n.gear-part.company .part-state{color:#2e8b63!important}\n.gear-part.other{\n  background:#fff0f2!important;\n  border-color:#e2a4b1!important;\n}\n.gear-part.other .part-state{color:#b44f65!important}\n</style>'''
              if '</head>' in s:
                  s = s.replace('</head>', visual_css + '\n</head>', 1)
              else:
                  s = visual_css + '\n' + s

          s = s.replace('VERSION 0.330', 'VERSION 0.334')
          s = s.replace('VERSION 0.332', 'VERSION 0.334')
          s = s.replace('VERSION 0.333', 'VERSION 0.334')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Highlight account sync and gear status cells v0.334'
          git push