name: Sidebar patch only
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sidebar and version
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="sidebar-page-preserve-v0387">
html,body{background:var(--bg)!important}
.app{background:var(--bg)!important;min-height:100vh!important}
.main{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:1!important;background:var(--bg)!important;min-height:100vh!important}
.sidebar{z-index:2000!important}
.sidebar-backdrop{background:transparent!important;backdrop-filter:none!important;opacity:0!important;pointer-events:none!important}
.sidebar.open,.sidebar.open:hover{transform:translateX(0)!important;z-index:2000!important;pointer-events:auto!important}
body.sidebar-open .sidebar,body.sidebar-open .sidebar:hover{transform:translateX(0)!important;z-index:2000!important;pointer-events:auto!important}
</style>'''
          if 'sidebar-page-preserve-v0387' not in s:
            s=s.replace('</head>',css+'</head>',1)
          Path('VERSION').write_text('0.387\n',encoding='utf-8')
          s=re.sub(r'VERSION\s+0\.386','VERSION 0.387',s)
          s=re.sub(r'(?<![0-9])0\.386(?![0-9])','0.387',s)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html VERSION
          git rm .github/workflows/sidebar-patch-only.yml
          git commit -m "Fix sidebar preserving current page and bump version to 0.387"
          git push
