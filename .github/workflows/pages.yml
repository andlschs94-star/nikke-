name: Deploy NIKKE Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply final site version and character row styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          version=Path('VERSION').read_text(encoding='utf-8').strip()
          css='''<style id="final-character-row-background">
          html.dark-theme #characterPanel table tbody td:nth-child(2),html.dark-mode #characterPanel table tbody td:nth-child(2),body.dark-theme #characterPanel table tbody td:nth-child(2),body.dark-mode #characterPanel table tbody td:nth-child(2),body.theme-dark #characterPanel table tbody td:nth-child(2),html[data-theme="dark"] #characterPanel table tbody td:nth-child(2),body[data-theme="dark"] #characterPanel table tbody td:nth-child(2),html.dark #characterPanel table tbody td:nth-child(2),body.dark #characterPanel table tbody td:nth-child(2){background:transparent!important;box-shadow:none!important}
          </style>'''
          s=re.sub(r'<style id="final-character-row-background">.*?</style>','',s,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          js=f'''<script id="site-version-sync">(()=>{{const v='v{version}';document.querySelectorAll('.version,.app-version,#version,#appVersion,.site-version,.footer-version').forEach(el=>el.textContent=v);document.querySelectorAll('body *').forEach(el=>{{if(el.children.length===0&&/v0\\.\\d{{3}}/.test(el.textContent.trim()))el.textContent=el.textContent.trim().replace(/v0\\.\\d{{3}}/g,v)}})}})();</script>'''
          s=re.sub(r'<script id="site-version-sync">.*?</script>','',s,flags=re.S)
          s=s.replace('</body>',js+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
