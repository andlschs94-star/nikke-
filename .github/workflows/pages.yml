name: Deploy NIKKE Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final dark character row styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="v0380-character-row-background-deploy">
          /* v0.380: 캐릭터 칸은 해당 행과 동일한 배경을 사용 */
          html.dark-theme #characterPanel table tbody td:nth-child(2),
          html.dark-mode #characterPanel table tbody td:nth-child(2),
          body.dark-theme #characterPanel table tbody td:nth-child(2),
          body.dark-mode #characterPanel table tbody td:nth-child(2),
          body.theme-dark #characterPanel table tbody td:nth-child(2),
          html[data-theme="dark"] #characterPanel table tbody td:nth-child(2),
          body[data-theme="dark"] #characterPanel table tbody td:nth-child(2),
          html.dark #characterPanel table tbody td:nth-child(2),
          body.dark #characterPanel table tbody td:nth-child(2),
          html.js-dark-detected #characterPanel table tbody td:nth-child(2),
          body.js-dark-detected #characterPanel table tbody td:nth-child(2) {
            background:transparent!important;
            box-shadow:none!important;
            border-left-color:#26324b!important;
            border-right-color:#26324b!important;
          }
          </style>'''
          s=re.sub(r'<style id="v0380-character-row-background-deploy">.*?</style>','',s,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          # The repository VERSION is 0.380; keep the visible page version in sync.
          s=s.replace('0.379','0.380')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
