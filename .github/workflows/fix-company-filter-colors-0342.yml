name: Fix company filter colors 0342

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/fix-company-filter-colors-0342.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply company filter styling
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''\n<style id="company-filter-inactive-0342">\n/* Company filter: keep the existing neutral style until selected. */\n.quick-filter-btn.company-filter:not(.active){\n  background:#0d1527!important;\n  color:#aeb9cf!important;\n  border-color:#2d3953!important;\n}\n</style>\n'''

          marker = '<style id="company-filter-inactive-0342">'
          if marker not in s:
              s = s.replace('</head>', css + '</head>', 1)

          s = re.sub(r'VERSION\s+[0-9]+(?:\.[0-9]+)+', 'VERSION 0.342', s, count=1)
          p.write_text(s, encoding='utf-8')
          Path('VERSION').write_text('0.342\n', encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html VERSION
          git diff --cached --quiet && exit 0
          git commit -m "Fix inactive company filter colors 0.342 [skip ci]"
          git push