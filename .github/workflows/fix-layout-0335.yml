name: Fix NIKKE screen alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[layout-fix]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize page alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n/* layout normalization 0.335 */\nhtml,body{width:100%;max-width:100%;margin:0;padding:0;overflow-x:hidden}\n.app{width:100%;max-width:100%;margin:0;padding:0;justify-content:flex-start}\n.main{width:100%;max-width:none;min-width:0;flex:1 1 auto;margin-left:0!important;margin-right:0!important;padding-left:0!important}\n.topbar,.panel,#characterPanel,#kpis{max-width:none}\n'''
          marker = '/* layout normalization 0.335 */'
          if marker not in s:
              s = s.replace('</style>', css + '</style>', 1)
          import re
          s = re.sub(r'(?i)(VERSION\\s*)0\\.33[0-4]', r'\\g<1>0.335', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit alignment fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix overall screen alignment v0.335 [layout-fix]'
          git push
