name: Equipment panel background fix
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix and bump version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='equipment-panel-background-fix-v0390'
          patch='''<style id="equipment-panel-background-fix-v0390">
          body:not(.dark-theme) .drop-rate-view,
          body:not(.dark-theme) .drop-rate-view #app,
          body:not(.dark-theme) .drop-rate-view .app,
          body:not(.dark-theme) .drop-rate-view .main,
          body:not(.dark-theme) .drop-rate-view main,
          body:not(.dark-theme) .drop-rate-view .content,
          body:not(.dark-theme) .drop-rate-view .section,
          body:not(.dark-theme) .drop-rate-view .panel,
          body:not(.dark-theme) .drop-rate-view .card,
          body:not(.dark-theme) .drop-rate-view .accordion,
          body:not(.dark-theme) .drop-rate-view .accordion-wrap,
          body:not(.dark-theme) .drop-rate-view .equipment-section,
          body:not(.dark-theme) .drop-rate-view .equipment-panel-wrap,
          body:not(.dark-theme) .drop-rate-view .corporate-equipment-section,
          body:not(.dark-theme) .drop-rate-view .corporate-equipment-panel-wrap,
          body:not(.dark-theme) .drop-rate-view .drop-rate-accordion,
          body:not(.dark-theme) .drop-rate-view .drop-rate-panel,
          body:not(.dark-theme) .drop-rate-view .drop-rate-section {
            background-color:#dcecf7!important;
          }
          body:not(.dark-theme) .drop-rate-view .drop-rate-accordion,
          body:not(.dark-theme) .drop-rate-view .drop-rate-panel,
          body:not(.dark-theme) .drop-rate-view .drop-rate-section {
            border-color:#a9cde4!important;
          }
          </style>'''
          if marker not in s:
              s=s.replace('</head>',patch+'</head>',1)
          vf=Path('VERSION')
          old=vf.read_text(encoding='utf-8').strip() if vf.exists() else '0.389'
          m=re.fullmatch(r'(\d+)\.(\d+)',old)
          new=f'{m.group(1)}.{int(m.group(2))+1:03d}' if m else '0.390'
          vf.write_text(new+'\n',encoding='utf-8')
          s=re.sub(r'(?<![0-9])0\.(?:379|380|381|382|383|384|385|386|387|388|389)(?![0-9])',new,s)
          p.write_text(s,encoding='utf-8')
          print('version',old,'->',new)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html VERSION
          git diff --cached --quiet || git commit -m "fix: remove white gaps around equipment panels"
          git push
