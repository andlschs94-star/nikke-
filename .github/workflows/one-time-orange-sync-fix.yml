name: One-time orange sync button fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force light theme sync button color
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<button type="button" class="btn blsync-top-btn" onclick="openBlablalinkSyncGuide()">계정 동기화</button>'
          new='<button type="button" class="btn blsync-top-btn" style="background:#fff1dc!important;border:1px solid #e5a14f!important;color:#a85f16!important;box-shadow:0 2px 8px rgba(214,142,50,.16)!important;font-weight:900!important" onclick="openBlablalinkSyncGuide()">계정 동기화</button>'
          if old in s:
            s=s.replace(old,new,1)
          else:
            s=s.replace('class="btn blsync-top-btn"','class="btn blsync-top-btn" style="background:#fff1dc!important;border:1px solid #e5a14f!important;color:#a85f16!important;box-shadow:0 2px 8px rgba(214,142,50,.16)!important;font-weight:900!important"',1)
          m=re.search(r'VERSION\s+(\d+\.\d+)',s)
          if m:
            oldv=m.group(1); a,b=oldv.split('.'); newv=f'{a}.{int(b)+1:03d}'
            s=s.replace(f'VERSION {oldv}',f'VERSION {newv}',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-orange-sync-fix.yml
          git add index.html
          git commit -m "Fix light theme account sync button color"
          git push
