name: inject-profile-button
on:
  push:
    paths:
      - 'profile-import-button.js'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="profile-import-button.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html에 </body>가 없습니다.')
              s=s.replace(marker, tag+marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit site change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add BlaBlaLink profile import test button'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/inject-profile-button.yml
          git add .github/workflows/inject-profile-button.yml
          git commit -m 'Remove temporary profile button workflow' || true
          git push || true
