name: Force Pages refresh 0.402
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: force-pages-refresh-0402
  cancel-in-progress: false
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set visible version to 0.402
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("VERSION 0.401","VERSION 0.402")
          s=s.replace("VERSION 0.400","VERSION 0.402")
          p.write_text(s,encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git rm .github/workflows/force-pages-refresh-0402.yml
          git commit -m "fix: make v0.402 visible on GitHub Pages"
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
