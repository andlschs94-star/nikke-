name: Fix unowned button UI
on:
  push:
    paths:
      - '.github/workflows/fix-unowned-button.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match unowned button UI to unused button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.unowned-view-btn{'
          if old in s:
              start=s.index(old)
              end=s.index('}', start)+1
              s=s[:start]+s[start:end].replace('.unowned-view-btn','.unused-view-btn')+s[end:]
          else:
              # If there is no dedicated style, make the class inherit the exact
              # existing unused-view button styling without changing its behavior.
              s=s.replace('</style>','.unowned-view-btn{width:auto;border:1px solid var(--line);background:#0d1527;color:#b7c2d9;border-radius:9px;padding:9px 10px;margin-bottom:8px;font-weight:700}.unowned-view-btn.active{background:#211d3b;border-color:var(--accent);color:#fff}</style>',1)
          s=s.replace('<!-- GitHub Pages deployment refresh 0.229 -->','<!-- GitHub Pages deployment refresh 0.230 -->',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '미보유 캐릭터 버튼 UI를 미사용 버튼과 통일'
          git push
