name: Fix unowned button UI
on:
  push:
    paths:
      - '.github/workflows/fix-unowned-button.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update character status toggle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          helper = '''function characterStatusState(i,r){
            const n=characterName(i,r);
            if(!n)return 'off';
            if(unusedCharacters.has(n))return 'unused';
            if(unownedCharacters.has(n))return 'unowned';
            return 'off';
          }
          function toggleCharacterStatus(i){
            const name=characterName(i,data[i]);
            if(!name)return;
            const state=characterStatusState(i,data[i]);
            if(state==='off'){
              unusedCharacters.add(name);
              unownedCharacters.delete(name);
            }else if(state==='unused'){
              unusedCharacters.delete(name);
              unownedCharacters.add(name);
            }else{
              unownedCharacters.delete(name);
              unusedCharacters.delete(name);
            }
            saveUnusedCharacters();
            try{localStorage.setItem(accountStorageKey(ACCOUNT_UNOWNED_PREFIX,activeAccount),JSON.stringify([...unownedCharacters]));}catch(e){}
            updateUnusedViewButton();
            renderHeader();
            renderTable();
          }
          '''

          if 'function characterStatusState(i,r)' not in s:
              marker='function renderTable('
              if marker not in s:
                  raise SystemExit('renderTable marker not found')
              s=s.replace(marker,helper+'\n'+marker,1)

          old="미사용:`<button type=\"button\" class=\"unused-status-toggle ${isUnusedCharacter(i,r)?'active':''}\" onclick=\"event.stopPropagation();toggleUnusedCharacter(${i},${!isUnusedCharacter(i,r)})\" aria-label=\"${esc(r['이름'])} 미사용 여부\">${unownedCharacters.has(characterName(i,r))?'미보유':'미사용'}</button>`,"
          new="미사용:(()=>{const st=characterStatusState(i,r);return `<button type=\"button\" class=\"unused-status-toggle ${st==='unused'?'active':''} ${st==='unowned'?'unowned':''}\" onclick=\"event.stopPropagation();toggleCharacterStatus(${i})\" aria-label=\"${esc(r['이름'])} 상태 변경\">미사용</button>`})(),"
          if old in s:
              s=s.replace(old,new,1)
          elif 'characterStatusState(i,r)' not in s:
              raise SystemExit('character status cell pattern not found')

          css_marker='.completion-filter-popover{'
          css=".unused-status-toggle.unowned{border-color:#c58b3a;background:#3a2a16;color:#ffdca3}.unused-status-toggle.unowned:hover{border-color:#e0a94d;background:#493419;color:#ffe9bf}"
          if '.unused-status-toggle.unowned{' not in s:
              if css_marker not in s:
                  raise SystemExit('CSS marker not found')
              s=s.replace(css_marker,css+css_marker,1)

          s=s.replace('<!-- GitHub Pages deployment refresh 0.231 -->','<!-- GitHub Pages deployment refresh 0.232 -->',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '버전 0.232 적용'
          git push
