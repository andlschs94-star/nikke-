name: Layout space fix 0.338
on:
  push:
    paths:
      - '.github/workflows/layout-space-fix-0338.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply centered layout and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n<style id="layout-space-fix-0338">\n/* 0.338: keep the main UI centered with balanced side space */\n.app{display:block!important;min-height:100vh!important;}\n.main{width:calc(100% - 32px)!important;max-width:1600px!important;margin-left:auto!important;margin-right:auto!important;padding-left:0!important;padding-right:0!important;}\n</style>\n'''
          if 'id="layout-space-fix-0338"' in s:
              import re
              s=re.sub(r'\\n<style id="layout-space-fix-0338">.*?</style>\\n','\n',s,flags=re.S)
          s=s.replace('</head>', css+'</head>', 1)
          s=s.replace('VERSION 0.337','VERSION 0.338').replace('VERSION 0.336','VERSION 0.338')
          p.write_text(s,encoding='utf-8')
          v=Path('VERSION')
          if v.exists(): v.write_text('0.338\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html VERSION
          git commit -m 'Fix centered layout spacing v0.338' || true
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/layout-space-fix-0338.yml || true
          git commit -m 'Remove one-time layout workflow' || true
          git push || true
