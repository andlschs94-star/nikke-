name: Fix inner dark surfaces v0.326
on:
  push:
    paths:
      - '.github/workflows/fix-inner-dark-surfaces-v0326.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        env:
          CSS_B64:  b3V0cG9zdC1jdXJyZW50LXByb2R1Y3Rpb24sLm91dHBvc3QtY3VycmVudC1wcm9kdWN0aW9uLWl0ZW0sLm91dHBvc3QtY29yZS1oaW50LC5vdXRwb3N0LWNvcmUtYnJlYWtwb2ludC1saXN0LC5vdXRwb3N0LWNvcmUtYnJlYWtwb2ludC1yb3csLmRy b3AtcmF0ZS1ib2R5LC5kcm9wLXJhdGUtY29udGVudCwu  b3V0cG9zdC1jb3JlLXRocmVzaG9sZCB0ZHtiYWNrZ3JvdW5kOnJnYmEoMTQ2LDEyNSwyNTUsLjE0KWltcG9ydGFudH1cgpzZWxlY3QsaW5wdXQsdGV4dGFyZWF7YmFja2dyb3VuZDojZmZmIWltcG9ydGFudDtjb2xvcjojMTcyNjNiIWltcG9ydGFudDti b3JkZXItY29sb3I6I2M1ZGJlNiFpbXBvcnRhbnR9
        run: |
          python3 -c "import os,base64;from pathlib import Path;p=Path('index.html');s=p.read_text(encoding='utf-8');css=base64.b64decode(os.environ['CSS_B64'].replace(' ','')).decode();s=s.replace('</style>',css+'</style>',1) if 'v0.326: change dark INNER window/table surfaces' not in s else s;s=s.replace('0.325','0.326');p.write_text(s,encoding='utf-8')"
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-inner-dark-surfaces-v0326.yml
          git commit -m 'Fix inner dark window surfaces (v0.326)'
          git push
