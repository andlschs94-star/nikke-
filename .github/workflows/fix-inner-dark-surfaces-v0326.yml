name: Fix inner dark surfaces v0.326
on:
  push:
    paths:
      - '.github/workflows/fix-inner-dark-surfaces-v0326.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch inner surfaces and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
/* v0.326: change dark INNER window/table surfaces while preserving text colors */
:root{--bg:#f4f9fc;--panel:#f8fcfe;--panel2:#eef6fa;--line:#c8dce7;--text:#17263b;--muted:#71849a}
html,body{background:#f4f9fc!important;color:var(--text)}
/* Inner tables and list bodies */
table,thead,tbody,tr,td,th{background:#f8fcfe!important;color:inherit}
thead,th{background:#e8f3f8!important}
tbody tr:nth-child(even),tbody tr:nth-child(odd){background:#f8fcfe!important}
tbody td,tbody th{border-color:#cfe0e8!important}
/* Common dark inner surfaces */
.outpost-production-body,.outpost-table-wrap,.outpost-table,.outpost-calc,.outpost-calc-progress,.outpost-level-card,.outpost-current-production,.outpost-current-production-item,.outpost-core-hint,.outpost-core-breakpoint-list,.outpost-core-breakpoint-row,.drop-rate-body,.drop-rate-content,.owned-corporate-body,.owned-corporate-table-wrap,.unused-transfer-body,.required-gear-body,.character-list,.character-table-wrap,.gear-table-wrap,.panel-body,.card-body,.modal-body,.popup-body,.drawer-body{background:#f8fcfe!important;color:inherit!important}
/* Explicit dark cells/rows used by the corporate-equipment panels */
.owned-corporate-table tr,.owned-corporate-table td,.owned-corporate-table th,.required-gear-table tr,.required-gear-table td,.required-gear-table th,.gear-table tr,.gear-table td,.gear-table th{background:#f8fcfe!important;color:inherit!important;border-color:#cfe0e8!important}
/* Preserve intentionally highlighted status cells */
.outpost-table tr.outpost-core-threshold td{background:rgba(146,125,255,.14)!important}
/* Inputs/selects inside windows */
select,input,textarea{background:#fff!important;color:#17263b!important;border-color:#c5dbe6!important}
/* Scroll tracks / containers */
.outpost-table-wrap,.outpost-core-breakpoint-list,.gear-table-wrap{scrollbar-color:#9db4c2 #edf5f8}
'''
          marker='</style>'
          if 'v0.326: change dark INNER window/table surfaces' not in s:
              s=s.replace(marker, css+'\n'+marker, 1)
          s=s.replace('0.325','0.326')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-inner-dark-surfaces-v0326.yml
          git rm .github/workflows/fix-inner-dark-surfaces-v0326.yml
          git commit -m 'Fix inner dark window surfaces (v0.326)'
          git push
