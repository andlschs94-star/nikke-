name: Fix old GitHub username references

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old username
        run: |
          set -e
          changed=0
          for file in index.html blablalink-sync-v1.0.23.user.js; do
            if [ -f "$file" ] && grep -q 'andlschs94-star' "$file"; then
              sed -i 's/andlschs94-star/nikkegear885/g' "$file"
              git add "$file"
              changed=1
            fi
          done
          if [ "$changed" -eq 1 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Fix old GitHub username references'
            git push
          else
            echo 'No old username references found.'
          fi
