function renderDropRatePanel(){const box=document.getElementById('dropRatePanel');if(!box)return;const need=getNeedTotals();const pool=Math.max(1,Number(dropRateSettings.pool)||1);const fmt=n=>Number(n).toLocaleString('ko-KR');const cards=gearParts.map(p=>{const stage=Number(dropRateSettings[p]||9);const rate=DROP_RATES[stage]||0;const target=rate/pool;const n=need[p]||0;const exp=target>0?Math.ceil(n/(target/100)):0;return `<div class="drop-rate-card"><h4>${p} 던전</h4><div class="drop-rate-row"><label>파밍 단계</label><select onchange="setDropRateStage('${p}',this.value)">${Object.entries(DROP_RATES).map(([st,rt])=>`<option value="${st}" ${Number(st)===stage?'selected':''}>${st}단계 · ${rt}%</option>`).join('')}</select></div><div class="drop-rate-value">${rate}%</div><div class="drop-rate-sub">기업장비 등장 확률</div><div class="drop-rate-result">현재 필요 수량 <b>${fmt(n)}개</b><br>원하는 1종의 이론상 획득 확률 <b>${target.toFixed(2)}%</b><br>필요 수량 기준 이론상 클리어 <b>${fmt(exp)}회</b></div></div>`}).join('');box.innerHTML=`<div class="drop-rate-wrap"><div class="drop-rate-head"><div><h3>기업장비 획득 확률</h3><div class="drop-rate-note">각 부위 던전은 1~9단계별 기업장비 등장 확률을 사용합니다. 기업장비는 설정한 종류 수 중 무작위로 등장합니다.</div></div><div class="drop-rate-pool"><label>랜덤 기업장비 종류 수</label><input type="number" min="1" max="100" value="${pool}" onchange="setDropRatePool(this.value)"></div></div><div class="drop-rate-grid">${cards}</div><div class="drop-rate-footnote">단일 목표 장비 확률은 <b>단계 확률 ÷ 랜덤 기업장비 종류 수</b>로 계산합니다. 현재 기본값은 15종이며 직접 변경할 수 있습니다.</div></div>`}
function setDropRateStage(part,stage){dropRateSettings[part]=Number(stage)||9;saveDropRateSettings();renderDropRatePanel()}
function setDropRatePool(v){dropRateSettings.pool=Math.max(1,Math.min(100,Number(v)||1));saveDropRateSettings();renderDropRatePanel()}

function getFiltered(){
  const searchEl=document.getElementById('search');
  const q=(searchEl?.value||'').trim().toLowerCase();
  let arr=data.map((r,i)=>({r,i})).filter(({r,i})=>{
    if(q){
      const hay=[r['이름'],r['무기'],r['스킬1'],r['스킬2'],r['버스트스킬']].map(x=>String(x??'').toLowerCase()).join(' ');
      if(!hay.includes(q)) return false;
    }
    if(filters.기업.size&&!filters.기업.has(r['기업'])) return false;
    if(filters.속성.size&&!filters.속성.has(r['속성'])) return false;
    if(filters.클래스.size&&!filters.클래스.has(r['클래스'])) return false;
    if(filters.무기.size&&!filters.무기.has(r['무기'])) return false;
    if(filters.버스트.size&&!filters.버스트.has(r['버스트'])) return false;
    if(filters.큐브&&filters.큐브.size&&!filters.큐브.has(String(r['큐브']??''))) return false;
    const g=gearState(r);
    if(completionFilters.hideUnused && isUnusedCharacter(i,r)) return false;
    if(completionFilters.hideFullOverload && g.overload===4) return false;
    if(completionFilters.hideFullCompany && g.parts.every(x=>x.category==='company'||x.category==='overload')) return false;
    const activeGearParts=gearParts.filter(p=>(filters.장비부위별[p]||new Set()).size>0);
    if(activeGearParts.length){
      const matched=activeGearParts.every(p=>{
        const set=filters.장비부위별[p];
        const idx=gearParts.indexOf(p);
        return set.has(g.parts[idx].category);
      });
      if(!matched) return false;
    }
    return true;
  });
  const sort=document.getElementById('powerSort')?.value||'none';
  if(sort!=='none') arr.sort((a,b)=>sort==='desc'?num(b.r['전투력'])-num(a.r['전투력']):num(a.r['전투력'])-num(b.r['전투력']));
  return arr;
}

  돌파:{label:'돌파'}, 코강:{label:'코강'}, 스킬:{label:'스킬'}, 옵션:{label:'옵션'}, 큐브:{label:'큐브',filter:true}

let selectedCharacters=(()=>{try{const v=JSON.parse(localStorage.getItem(CHARACTER_SELECTION_STORAGE)||'[]');return new Set(Array.isArray(v)?v.map(Number).filter(Number.isInteger):[])}catch(e){return new Set()}})();

function characterName(i,r){return String((r||data[i]||{})['이름']??'').trim();}
let unusedCharacters=(()=>{try{
  const v=JSON.parse(localStorage.getItem(UNUSED_STORAGE)||'null');
  if(Array.isArray(v)) return new Set(v.map(x=>String(x).trim()).filter(Boolean));
  const old=JSON.parse(localStorage.getItem('nikke_unused_characters_v1')||'[]');
  const names=new Set();
  if(Array.isArray(old)) old.forEach(x=>{const idx=Number(x);if(Number.isInteger(idx)&&RAW[idx]){const n=characterName(idx,RAW[idx]);if(n)names.add(n);}});
  return names;
}catch(e){return new Set()}})();
function isUnusedCharacter(i,r){const n=characterName(i,r);return n?unusedCharacters.has(n):false;}

function positionHeaderPopover(pop,btn){
  const r=btn.getBoundingClientRect();
  let left=r.left, top=r.bottom+6;
  const maxLeft=window.innerWidth-pop.offsetWidth-8;
  const maxTop=window.innerHeight-pop.offsetHeight-8;
  left=Math.max(8,Math.min(left,maxLeft));
  top=Math.max(8,Math.min(top,maxTop));
  pop.style.left=left+'px';pop.style.top=top+'px';
}

function openHeaderFilter(key,btn){
  if(headerKey===key){closeHeaderFilter();return}

function outsideHeaderOnce(e){

  document.removeEventListener('click',outsideHeaderOnce,{capture:true});closeHeaderFilter();
}

}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1300)}
function openDrawer(i){editIndex=i;const r=data[i];document.getElementById('dAvatar').textContent=String(r['이름']||'N').slice(0,1);document.getElementById('dName').textContent=r['이름']||'-';document.getElementById('dMeta').textContent=`${r['기업']} · ${r['속성']} · ${r['버스트']} · ${r['클래스']}`;document.getElementById('drawerBody').innerHTML=`<div class="edit-grid">${field('전투력','전투력',r['전투력'])}${field('호감도','호감도',r['호감도'])}${field('돌파','돌파',r['돌파'])}${field('코강','코강',r['코강'])}${field('스킬1','스킬1',r['스킬1'])}${field('스킬2','스킬2',r['스킬2'])}${field('버스트스킬','버스트스킬',r['버스트스킬'])}${field('큐브','큐브',r['큐브'])}${field('큐브 레벨','큐브_레벨',r['큐브_레벨'])}</div>${gearParts.map(p=>pieceHTML(p,r)).join('')}<label class="unused-toggle"><input type="checkbox" id="unusedCharacterToggle" ${isUnusedCharacter(i,r)?'checked':''}> 이 캐릭터는 사용하지 않음 <span class="unused-badge">숨김 대상</span></label><div style="margin-top:14px"><button class="btn primary" onclick="saveDrawer()">저장</button></div>`;document.getElementById('drawer').classList.add('open')}

function filterHasValue(key){
  if(key==='전투력') return document.getElementById('powerSort').value!=='desc';
  if(gearParts.includes(key)) return (filters.장비부위별[key]||new Set()).size>0;
  if(key==='버스트') return filters.버스트.size>0;
  if(key==='기업'||key==='속성'||key==='클래스'||key==='무기') return filters[key].size>0;
  if(key==='큐브') return filters.큐브?.size>0;
  return false;
}
function updateFilterUI(){
  document.querySelectorAll('.th-btn[data-filter-key]').forEach(btn=>btn.classList.toggle('active',filterHasValue(btn.dataset.filterKey)));
}

function field(label,key,val){return `<div class="field"><label>${label}</label><input data-key="${key}" value="${esc(val??'')}" /></div>`}
function pieceHTML(p,r){const st=gearPartState(r,p);const company=gearCompanyType(r,p);return `<div class="piece"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><h4 style="margin:0">${p}</h4><span class="piece-status ${st.type}">${st.label}</span></div><div class="edit-grid"><div class="field"><label>티어</label><input data-key="${p}_티어" value="${esc(r[p+'_티어']??'')}" /></div><div class="field"><label>레벨</label><input data-key="${p}_레벨" value="${esc(r[p+'_레벨']??'')}" /></div><div class="field"><label>기업장비 여부</label><select data-key="${p}_기업장비"><option value="">미지정</option><option value="company" ${company==='company'?'selected':''}>기업장비</option><option value="other" ${company==='other'?'selected':''}>기업 불일치</option></select></div>${[1,2,3].map(n=>`<div class="field"><label>옵션${n}</label><input data-key="${p}_옵${n}" value="${esc(r[p+'_옵'+n]??'')}" /></div><div class="field"><label>옵션${n} 값</label><input data-key="${p}_옵${n}값" value="${esc(r[p+'_옵'+n+'값']??'')}" /></div>`).join('')}</div></div>`}
function saveDrawer(){document.querySelectorAll('#drawerBody [data-key]').forEach(el=>data[editIndex][el.dataset.key]=el.value===''?null:el.value);const u=document.getElementById('unusedCharacterToggle');if(u){const name=characterName(editIndex,data[editIndex]);if(name){if(u.checked)unusedCharacters.add(name);else unusedCharacters.delete(name);saveUnusedCharacters();}}save();renderTable();closeDrawer();toast('저장되었습니다')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');editIndex=-1}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download('nikke_gear_backup.json',JSON.stringify(data,null,2),'application/json')}
function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(){const cols=Object.keys(data[0]||{});const text='\ufeff'+[cols.map(csvCell).join(','),...data.map(r=>cols.map(c=>csvCell(r[c])).join(','))].join('\n');download('nikke_gear_current.csv',text,'text/csv;charset=utf-8')}
function closeCompletionFilter(){if(completionPopover){completionPopover.remove();completionPopover=null;}const b=document.getElementById('completionFilterBtn');if(b)b.classList.remove('active');}
function toggleCompletionFilter(e){e?.stopPropagation();if(completionPopover){closeCompletionFilter();return;}const btn=document.getElementById('completionFilterBtn');if(!btn)return;completionPopover=document.createElement('div');completionPopover.className='completion-filter-popover';completionPopover.innerHTML=`<h4>캐릭터 숨기기</h4><div class="completion-filter-option"><label><input type="checkbox" ${completionFilters.hideUnused?'checked':''}> 사용하지 않는 캐릭터 숨기기</label><small>캐릭터 상세에서 ‘이 캐릭터는 사용하지 않음’을 체크한 캐릭터</small></div><div class="completion-filter-option"><label><input type="checkbox" ${completionFilters.hideFullOverload?'checked':''}> 오버로드 4부위 완료 캐릭터 숨기기</label><small>머리·몸통·장갑·다리 모두 오버로드인 캐릭터</small></div><div class="completion-filter-option"><label><input type="checkbox" ${completionFilters.hideFullCompany?'checked':''}> 기업장비 4부위 완료 캐릭터 숨기기</label><small>기업장비 또는 오버로드로 4부위가 모두 채워진 캐릭터<br>※ 오버로드+기업장비 혼합도 제외</small></div>`;document.body.appendChild(completionPopover);const boxes=completionPopover.querySelectorAll('input');boxes[0].addEventListener('change',e=>{completionFilters.hideUnused=!!e.target.checked;try{localStorage.setItem('nikke_hide_unused_filter',completionFilters.hideUnused?'1':'0')}catch(_){}updateCompletionFilterUI();renderTable()});boxes[1].addEventListener('change',e=>{completionFilters.hideFullOverload=e.target.checked;updateCompletionFilterUI();renderTable()});boxes[2].addEventListener('change',e=>{completionFilters.hideFullCompany=e.target.checked;updateCompletionFilterUI();renderTable()});const r=btn.getBoundingClientRect();let left=r.left,top=r.bottom+6;left=Math.max(8,Math.min(left,window.innerWidth-completionPopover.offsetWidth-8));top=Math.max(8,Math.min(top,window.innerHeight-completionPopover.offsetHeight-8));completionPopover.style.left=left+'px';completionPopover.style.top=top+'px';btn.classList.add('active');setTimeout(()=>document.addEventListener('click',outsideCompletionOnce,{capture:true}),0)}
function outsideCompletionOnce(e){if(!completionPopover)return;if(completionPopover.contains(e.target)||e.target.closest?.('#completionFilterBtn'))return;document.removeEventListener('click',outsideCompletionOnce,{capture:true});closeCompletionFilter();}
function updateCompletionFilterUI(){const b=document.getElementById('completionFilterBtn');if(b)b.classList.toggle('active',completionFilters.hideUnused||completionFilters.hideFullOverload||completionFilters.hideFullCompany);updateHideTargetButtons();}
function updateHideTargetButtons(){const map={unused:'hideUnused',overload:'hideFullOverload',company:'hideFullCompany'};document.querySelectorAll('.hide-toggle').forEach(btn=>btn.classList.toggle('active',!!completionFilters[map[btn.dataset.hideTarget]]));}
function toggleHideTarget(kind){const map={unused:'hideUnused',overload:'hideFullOverload',company:'hideFullCompany'};completionFilters[map[kind]]=!completionFilters[map[kind]];updateHideTargetButtons();renderTable();}
function clearFilters(){filters.기업.clear();filters.속성.clear();filters.클래스.clear();filters.무기.clear();filters.버스트.clear();filters.큐브.clear();gearParts.forEach(p=>filters.장비부위별[p].clear());completionFilters.hideUnused=false;completionFilters.hideFullOverload=false;completionFilters.hideFullCompany=false;document.getElementById('powerSort').value='desc';closeHeaderFilter();closeCompletionFilter();updateCompletionFilterUI();renderHeader();renderTable();toast('필터를 초기화했습니다');}
function resetAll(){if(confirm('원본 CSV 데이터와 캐릭터 선택을 초기화할까요?')){data=structuredClone(RAW);selectedCharacters.clear();unusedCharacters.clear();saveSelectedCharacters();saveUnusedCharacters();save();clearFilters();toast('초기화되었습니다')}}

document.getElementById('search').addEventListener('input',renderTable);document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});renderHeader();renderTable();updateHideTargetButtons();


function openExcludeCharacterModal(){const m=document.getElementById('excludeModal');if(!m)return;m.hidden=false;const q=document.getElementById('excludeSearch');if(q){q.value='';setTimeout(()=>q.focus(),0)}renderExcludeCharacterList();}
function closeExcludeCharacterModal(){const m=document.getElementById('excludeModal');if(m)m.hidden=true;}
function renderExcludeCharacterList(){const list=document.getElementById('excludeList');const q=(document.getElementById('excludeSearch')?.value||'').trim().toLowerCase();if(!list)return;const rows=data.map((r,i)=>({r,i})).filter(x=>!q||String(x.r['이름']??'').toLowerCase().includes(q));list.innerHTML=rows.map(({r,i})=>`<label class="exclude-item"><input type="checkbox" data-exclude-index="${i}" ${isUnusedCharacter(i,r)?'checked':''}><span>${esc(r['이름']||'-')}</span><span class="meta">${esc(r['기업']||'')} · ${esc(r['클래스']||'')}</span></label>`).join('');list.querySelectorAll('input[data-exclude-index]').forEach(cb=>cb.addEventListener('change',()=>{const i=Number(cb.dataset.excludeIndex);const name=characterName(i,data[i]); if(name){if(cb.checked)unusedCharacters.add(name);else unusedCharacters.delete(name);}updateExcludeCount();}));updateExcludeCount();}
function updateExcludeCount(){const el=document.getElementById('excludeCount');if(el)el.textContent=`현재 제외 캐릭터 ${unusedCharacters.size}명`; }
function setVisibleExclude(flag){document.querySelectorAll('#excludeList input[data-exclude-index]').forEach(cb=>{const i=Number(cb.dataset.excludeIndex),name=characterName(i,data[i]);if(name){if(flag)unusedCharacters.add(name);else unusedCharacters.delete(name);}cb.checked=flag});saveUnusedCharacters();updateExcludeCount();}
function clearAllExcludedCharacters(){unusedCharacters.clear();saveUnusedCharacters();renderExcludeCharacterList();}
function applyExcludeCharacters(){saveUnusedCharacters();renderTable();closeExcludeCharacterModal();toast('캐릭터 제외 설정을 적용했습니다');}
function toggleGearDetail(){const b=document.querySelector(".gear-detail-body"),btn=document.getElementById("gearDetailToggle");if(!b||!btn)return;const show=b.hidden;b.hidden=!show;const s=btn.querySelector("span");btn.firstChild.nodeValue=show?"기업×클래스 상세 현황 접기 ":"기업×클래스 상세 현황 보기 ";if(s)s.textContent=show?"−":"＋";}

let quickGearPopover=null;
function closeQuickGearEditor(){if(quickGearPopover){quickGearPopover.remove();quickGearPopover=null;}}
function openQuickGearEditor(i,part){
  closeQuickGearEditor();
  const r=data[i], st=gearPartState(r,part), anchor=event?.currentTarget;
  quickGearPopover=document.createElement('div');quickGearPopover.className='quick-gear-pop';
  const statuses=[['overload','오버로드'],['company','기업장비'],['normal','일반장비'],['missing','미착용']];
  quickGearPopover.innerHTML=`<h4>${esc(r['이름']||'')} · ${part}</h4><div class="qg-meta">현재: ${esc(st.label)} · 클릭 즉시 저장</div><div class="quick-gear-grid">${statuses.map(([v,l])=>`<button type="button" class="quick-gear-btn ${v} ${st.category===v?'active':''}" onclick="setQuickGearStatus(${i},'${part}','${v}')">${l}</button>`).join('')}</div><button type="button" class="quick-gear-close" onclick="closeQuickGearEditor()">닫기</button>`;
  document.body.appendChild(quickGearPopover);
  const a=anchor||document.activeElement, rct=a?.getBoundingClientRect?.()||{left:20,bottom:80,right:260};
  let left=rct.left, top=rct.bottom+6;
  left=Math.max(8,Math.min(left,window.innerWidth-248)); top=Math.max(8,Math.min(top,window.innerHeight-210));
  quickGearPopover.style.left=left+'px';quickGearPopover.style.top=top+'px';
  setTimeout(()=>document.addEventListener('click',outsideQuickGear,{capture:true}),0);
}
function outsideQuickGear(e){if(!quickGearPopover)return;if(quickGearPopover.contains(e.target)||e.target.closest?.('.gear-part'))return;document.removeEventListener('click',outsideQuickGear,{capture:true});closeQuickGearEditor();}
function setQuickGearStatus(i,part,status){
  const r=data[i];
  if(status==='missing'){
    r[part+'_티어']=0; r[part+'_레벨']=0; r[part+'_기업장비']='';
  }else if(status==='overload'){
    r[part+'_티어']=10;
    if(num(r[part+'_레벨'])<0) r[part+'_레벨']=0;
    if(r[part+'_레벨']===''||r[part+'_레벨']==null) r[part+'_레벨']=0;
  }else if(status==='company'){
    r[part+'_티어']=9; r[part+'_기업장비']='company';
  }else if(status==='normal'){
    r[part+'_티어']=9; r[part+'_기업장비']='';
  }
  save(); closeQuickGearEditor(); renderTable(); toast(`${part} → ${status==='overload'?'오버로드':status==='company'?'기업장비':status==='normal'?'일반장비':'미착용'} 변경`);
}
</script></body></html>
