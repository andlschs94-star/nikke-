<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlaBlaLink 프로필 캐릭터 가져오기</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:20px;background:#080d19;color:#edf2ff}input,button{font-size:16px;padding:10px;margin:4px 0}input{width:100%;box-sizing:border-box;background:#0d1527;color:#fff;border:1px solid #394867;border-radius:7px}button{background:#927dff;color:#fff;border:0;border-radius:7px;font-weight:800;cursor:pointer}#status,#list{white-space:pre-wrap;margin-top:16px;padding:12px;background:#10192c;border:1px solid #26324b;border-radius:8px}.row{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #26324b}</style></head><body><h1>BlaBlaLink 프로필 캐릭터 가져오기</h1><p>기존 계정동기화와 별도로 공개 프로필 기반 조회를 테스트합니다.</p><input id="url" placeholder="https://www.blablalink.com/user?openid=..."><button id="load">캐릭터 정보 불러오기</button><div id="status">대기 중</div><div id="list"></div><script>const API='https://api.blablalink.com/api/game/proxy/Game/GetUserCharacterDetails';const CHARS='https://api.blablalink.com/api/game/proxy/Game/GetUserCharacters';const areas=[81,82,83,84,85];function decodeOpenId(u){const x=new URL(u);const v=x.searchParams.get('openid');if(!v)throw Error('URL에서 openid를 찾지 못했습니다.');let s=atob(v.replace(/-/g,'+').replace(/_/g,'/'));while(s.length%4)s+='=';return s.includes('-')?s.split('-').slice(-1)[0]:s}async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json;charset=UTF-8'},body:JSON.stringify(body),credentials:'omit'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function findArea(id){for(const area of areas){try{const j=await post(API,{intl_open_id:id,nikke_area_id:area,name_codes:[5167]});if(Number(j?.code)===0)return area}catch(e){}}return null}function nameOf(c){return c.name||c.nickname||c.role_name||c.character_name||c.name_code||c.id||c.character_id||'알 수 없음'}function listOf(j){const d=j?.data||{};return d.characters||d.character_list||d.user_characters||d.nikkes||d.list||[]}document.getElementById('load').onclick=async()=>{const status=document.getElementById('status'),list=document.getElementById('list');list.textContent='';try{const id=decodeOpenId(document.getElementById('url').value.trim());status.textContent='openid 변환 완료. 공개 데이터 조회 중...';const area=await findArea(id);if(!area)throw Error('공개 캐릭터 데이터를 조회하지 못했습니다. CORS 또는 공개 조회 제한일 수 있습니다.');status.textContent='서버 '+area+' 확인. 캐릭터 목록 조회 중...';const j=await post(CHARS,{intl_open_id:id,nikke_area_id:area});if(Number(j?.code)!==0)throw Error(j?.message||j?.msg||'캐릭터 목록 조회 실패');const arr=listOf(j);status.textContent='조회 성공: '+arr.length+'개';if(!arr.length){list.textContent=JSON.stringify(j,null,2);return}list.innerHTML=arr.map(c=>'<div class="row"><b>'+String(nameOf(c)).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</b><span>'+String(c.level??c.lv??'')+'</span></div>').join('')}catch(e){status.textContent='실패: '+e.message;console.error(e)}};</script></body></html>
