<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>BlaBlaLink 프로필 캐릭터 가져오기 테스트</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:20px}input,button{font-size:16px;padding:10px;margin:4px 0}input{width:100%;box-sizing:border-box}#status{white-space:pre-wrap;margin-top:16px;padding:12px;background:#f4f4f4;border-radius:8px}</style></head><body><h1>BlaBlaLink 프로필 캐릭터 가져오기</h1><p>기존 동기화 기능과 별도로 테스트하는 기능입니다.</p><input id="url" placeholder="BlaBlaLink 프로필 링크를 붙여넣으세요"><button id="load">캐릭터 정보 불러오기</button><div id="status">대기 중</div><script>const $=id=>document.getElementById(id);function decodeOpenId(u){try{const x=new URL(u);const v=x.searchParams.get('openid');if(!v)throw new Error('URL에서 openid를 찾을 수 없습니다.');const s=atob(v.replace(/-/g,'+').replace(/_/g,'/'));return decodeURIComponent(Array.from(s).map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join(''));}catch(e){throw new Error('openid Base64 decode 실패: '+e.message)}}$('load').onclick=async()=>{const out=$('status');out.textContent='확인 중...';try{const intl=decodeOpenId($('url').value.trim());out.textContent='intl_openid 확인 완료:\n'+intl+'\n\n다음 단계: 공개 ShiftyPad/NIKKE roster API 엔드포인트 탐색이 필요합니다. 현재는 기존 사이트 데이터에는 접근하거나 변경하지 않습니다.';}catch(e){out.textContent=e.message}};</script></body></html>
